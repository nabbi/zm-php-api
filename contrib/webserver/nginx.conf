# Optional: in ZoneMinder's nginx server block, route /zm/api to the front
# controller directly instead of api/app/webroot/index.php (which forwards to it,
# so the stock configuration keeps working). The API routes on REQUEST_URI; p= is
# kept for configurations that read it.
#
# Put it inside `location /zm { ... }`, before the `\.php$` and image regexes,
# and remove the stock `location /zm/api/ { ... }`. nginx tries a prefix
# location's nested regexes before the prefix itself, so with the stock block
# /zm/api/src/App.php runs as a script and images under api/ are served as
# files. A regex placed first catches every /zm/api/ path but the front
# controller (docs/webserver.md).
location ~ ^/zm/api/(?!dispatch\.php$) {
    rewrite ^/zm/api(/.*)$ /zm/api/dispatch.php?p=$1 last;
}
