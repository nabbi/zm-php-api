# Optional: route /zm/api to the front controller directly. ZoneMinder's own
# Apache configuration (three <Directory> blocks rewriting into
# api/app/webroot) keeps working unchanged; this replaces those blocks with one.
# Tested with Apache 2.4: the front controller gets the original request URI,
# query string and body. @ZM_WEBDIR@ is ZoneMinder's web root, e.g.
# /usr/share/zoneminder/www.
<Directory "@ZM_WEBDIR@/api">
    RewriteEngine on
    RewriteBase /zm/api
    RewriteRule ^dispatch\.php$ - [L]
    RewriteRule ^ dispatch.php [L,QSA]
</Directory>
